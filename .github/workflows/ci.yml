name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prolog:
    name: Prolog (SWI-Prolog 10.0.2)
    runs-on: ubuntu-24.04
    container: swipl:10.0.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Instalar make
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends make
      - run: swipl --version
      - name: Testes Prolog (unidade, HTTP e aceite)
        run: make test-prolog

  elm:
    name: Elm (0.19.1, elm-test e elm-format)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v5
        with:
          path: ~/.elm
          key: elm-${{ hashFiles('frontend/elm.json') }}
      - name: Instalar elm, elm-test e elm-format fixados
        run: make deps
      - run: frontend/node_modules/.bin/elm --version
      - name: Verificar formatação Elm (elm-format)
        run: make check-format
      - name: Compilar bundle Elm (elm make --optimize)
        run: make build
      - name: Testes Elm
        run: make test-elm
